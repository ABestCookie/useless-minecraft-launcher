bind "x" "noclip"

// ==========================================
// 核心鍵位設定 (Movement & Basic)
// ==========================================

bind "w" "+forward"           // 前
bind "s" "+back"              // 後
bind "a" "+left"              // 左
bind "d" "+right"             // 右
bind "SHIFT" "+sprint"        // 靜走 (CS2)
bind "c" "+duck"           // 蹲下
bind "SPACE" "+jump"          // 跳躍
bind "e" "+use"               // 互動 (拆彈/開門)
bind "r" "+reload"            // 換彈

// ==========================================
// 戰鬥與投擲物 (Combat & Utility)
// ==========================================
bind "MOUSE1" "+attack"       // 左鍵射擊
bind "MOUSE2" "+attack2"      // 右鍵開鏡

// ==========================================
// 滾輪切換武器設定
// ==========================================
bind "q" "invprev"      // 滾輪向上：切換至上一個武器 (Previous)
bind "mwheeldown" "invnext"    // 滾輪向下：切換至下一個武器 (Next)


bind "g" "drop"               // 丟槍
bind "b" "buymenu"            // 買槍選單


// ==========================================
// 進階常用技巧 (Advanced)
// ==========================================
// 滾輪跳 (連跳必備)
bind "mwheelup" "+jump"

// 快速清除血跡或切換準心 (CS2 效果有限，但可保留)
bind "f" "+lookatweapon"      // 檢視武器

// 語音通訊
bind "t" "+voicerecord"       // 按住說話
bind "ENTER" "messagemode"    // 公開聊天
bind "u" "messagemode2"       // 隊伍聊天
bind "MOUSE3" "player_ping"       // 滾輪按下：玩家 Ping (CS2)

// ==========================================
// 系統設定
// ==========================================
bind "-" "toggleconsole"      // 開啟控制台 (Tab鍵上方)
bind "TAB" "+showscores"      // 計分板

// ==========================================
// 個人化準星設定 (依據你的 Console 數值整理)
// ==========================================
cl_crosshairstyle "4"                // 準星類型：4 (經典靜態)
cl_crosshairsize "1.9"               // 準星長度
cl_crosshairthickness "0.6"          // 準星粗細
cl_crosshairgap "-5"                 // 準星間距 (負值會讓準星更靠近中心)
cl_crosshairdot "0"                  // 中心點：關閉 (false)
cl_crosshair_t "0"                   // T型準星：關閉 (false)

// 顏色與透明度 (目前設定為粉紫色/洋紅色)
cl_crosshaircolor "5"                // 顏色模式：5 (自訂 RGB)
cl_crosshaircolor_r "255"            // 紅色數值
cl_crosshaircolor_g "0"              // 綠色數值
cl_crosshaircolor_b "255"            // 藍色數值
cl_crosshairusealpha "1"             // 啟用透明度 (true)
cl_crosshairalpha "200"              // 透明度數值 (0-255)

// 外框設定
cl_crosshair_drawoutline "1"         // 啟用外框
cl_crosshair_outlinethickness "0.5"  // 外框粗細

// 進階行為
cl_crosshair_recoil "0"              // 準星跟隨後座力：關閉 (false)
cl_crosshair_sniper_width "1"        // 狙擊鏡開鏡線條粗細
cl_crosshair_friendly_warning "1"    // 瞄準隊友警告：開啟
cl_crosshairgap_useweaponvalue "1"   // 根據武器自動調整間距：開啟 (true)

// ==========================================
// 靈敏度設定 (Sensitivity)
// ==========================================
sensitivity "4.5"                // 遊戲內主要靈敏度 (Mouse Sensitivity)
zoom_sensitivity_ratio "1.0"     // 開鏡後的靈敏度倍率 (例如 AWP, Scout)

// ==========================================
// 持槍視角設定 (Viewmodel)
// ==========================================
viewmodel_fov "68"               // 視野範圍 (最高 68)
viewmodel_offset_x "2.5"         // 水平偏移 (最右)
viewmodel_offset_y "0"           // 前後偏移
viewmodel_offset_z "-1.5"        // 垂直偏移 (最下)
viewmodel_presetpos "3"          // 預設位置類型：經典

// 寫入設定
host_writeconfig
echo "--- [Config Successfully Loaded] ---"
<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>設定 - Useless! Minecraft Launcher</title>
        <link rel="icon" href="./art/java.ico" type="image/x-icon"/>
        <script src="eel.js"></script>
        <script src="msgbox.js"></script>
        <link rel="stylesheet" href="setting.css">
        <link rel="stylesheet" href="msgbox.css">
    </head>
<body>

<div class="settings-card">
    <h2>🎮 遊戲進階設定</h2>

    <div class="group-label">JAVA & 性能分配</div>
    <div class="setting-list">
        <div class="row">
            <span>最大記憶體 (MB)<small>(總記憶體: <span id="total-mem">未知</span> MB)</small></span>
            <input type="number" id="cfg_ram" value="4096">
        </div>
        <div class="row">
            <span>Java 執行路徑</span>
            <input type="text" id="cfg_javapath" placeholder="Default Javaw.exe">
        </div>
        <div class="row">
            <span>JVM 啟動參數</span>
            <input type="text" id="cfg_jvm" value="-XX:+UseG1GC">
        </div>
    </div>

    <div class="group-label">啟動與顯示</div>
    <div class="setting-list">
        <div class="row">
            <span>視窗寬度</span>
            <input type="number" id="cfg_w" value="1920">
        </div>
        <div class="row">
            <span>視窗高度</span>
            <input type="number" id="cfg_h" value="1080">
        </div>
        <div class="row">
            <span>自動連接伺服器</span>
            <input type="text" id="cfg_ip" placeholder="Server IP">
        </div>
        <div class="row">
            <span>啟動後自動全螢幕</span>
            <label class="switch">
                <input type="checkbox" id="game_fullscreen">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <button class="btn-save" id="save-btn" onclick="handleSave()">確認並套用</button>
</div>

<script>
    // --- 接口說明 ---
    // 這裡就是你跟 Python 溝通的「窗口」
    const saveBtn = document.getElementById('save-btn');
    const totalMemSpan = document.getElementById('total-mem');
    eel.html_get_mem()(function(totalMem) {
        totalMemSpan.innerText = "";
        totalMemSpan.innerText = totalMem;
    });
    eel.html_get_config()(function(config) {
        document.getElementById('cfg_ram').value = config.ram || 4096;
        document.getElementById('cfg_javapath').value = config.java || "";
        document.getElementById('cfg_jvm').value = config.jvm || "-XX:+UseG1GC";
        document.getElementById('cfg_w').value = config.resolution ? config.resolution[0] : 1920;
        document.getElementById('cfg_h').value = config.resolution ? config.resolution[1] : 1080;
        document.getElementById('cfg_ip').value = config.server || "";
        document.getElementById('game_fullscreen').checked = config.fullscreen || false;
    });
    async function handleSave() {
        // 1. 抓取所有資料
        if (document.getElementById('cfg_ram').value > parseInt(totalMemSpan.innerText)) {
            showMsg("錯誤", "分配的記憶體超過總記憶體！");
            return;
        } else if (document.getElementById('cfg_ram').value < 512) {
            showMsg("錯誤", "分配的記憶體不建議小於 512MB！");
            return;
        } else {
            const gameData = {
                ram: document.getElementById('cfg_ram').value,
                java: document.getElementById('cfg_javapath').value,
                jvm: document.getElementById('cfg_jvm').value,
                resolution: [
                    document.getElementById('cfg_w').value,
                    document.getElementById('cfg_h').value
                ],
                server: document.getElementById('cfg_ip').value,
                fullscreen: document.getElementById('game_fullscreen').checked
            };

            console.log("資料包已打包:", gameData);
            saveBtn.innerText = "儲存中...";

            // 2. 這裡串接你的 Python 函式
            msg = await eel.save_game_config(gameData)();
            if (msg === 0) {
                showMsg("", "遊戲設定已儲存！");
                saveBtn.innerText = "確認並套用";
            } else {
                showMsg("錯誤", msg);
                saveBtn.innerText = "確認並套用";
            }
        
        }  
    }
</script>

</body>
</html>
